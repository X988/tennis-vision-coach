name: iOS

# Checks that the iOS app compiles (simulator build, no signing). Publishing
# to the App Store needs a Mac with Xcode and an Apple Developer account —
# see docs/RELEASE.md.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['ios/**', 'capacitor.config.ts', 'package.json', 'package-lock.json', '.github/workflows/ios.yml']

jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the iOS simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
